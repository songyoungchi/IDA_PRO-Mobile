name: Build IDA Pro Mobile (armv7 / API 27)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Fix incorrect activity-result dependency
      run: |
        # Replace the non-existent 'activity-result' artifact with the correct 'activity' artifact
        sed -i 's/androidx\.activity:activity-result:/androidx.activity:activity:/g' app/build.gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install NDK 25.1.8937393
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.1.8937393"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

    - name: Force armeabi-v7a ABI
      run: |
        mkdir -p ~/.gradle
        cat > ~/.gradle/init.gradle << 'EOF'
        allprojects {
            afterEvaluate { project ->
                if (project.hasProperty('android')) {
                    project.android {
                        defaultConfig {
                            ndk {
                                abiFilters 'armeabi-v7a'
                            }
                        }
                    }
                }
            }
        }
        EOF

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Verify APK contains armeabi-v7a libs
      run: |
        APK=app/build/outputs/apk/debug/app-debug.apk
        if [ -f "$APK" ]; then
          echo "APK found. Checking ABIs..."
          unzip -l "$APK" | grep "lib/armeabi-v7a/" || echo "⚠️ No armeabi-v7a libs found! App may not run on your device."
        else
          echo "❌ APK not found!"
          exit 1
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: ida-pro-mobile-armv7-debug
        path: app/build/outputs/apk/debug/app-debug.apk
