name: Build IDA Pro Mobile (armeabi-v7a ONLY / API 27)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Patch app module build file
      run: |
        python3 << 'PYEOF'
        import re, glob, sys

        candidates = []
        for path in glob.glob('**/build.gradle', recursive=True) + \
                    glob.glob('**/build.gradle.kts', recursive=True):
            if '/build/' in path or '/.gradle/' in path or '/.cxx/' in path:
                continue
            try:
                with open(path) as f:
                    c = f.read()
            except Exception:
                continue
            if re.search(r'defaultConfig\s*\{', c):
                candidates.append(path)

        if not candidates:
            print("❌ No build file with defaultConfig block found!")
            sys.exit(1)

        preferred = ['app/build.gradle.kts', 'app/build.gradle']
        target = next((p for p in preferred if p in candidates), candidates[0])
        print(f"✅ Target: {target}")

        with open(target) as f:
            content = f.read()

        is_kts = target.endswith('.kts')

        content = content.replace(
            'androidx.activity:activity-result',
            'androidx.activity:activity'
        )

        content, n_cc = re.subn(
            r'kotlinCompilerExtensionVersion\s*=\s*"[^"]*"',
            'kotlinCompilerExtensionVersion = "1.5.1"',
            content
        )
        print(f"✅ Compose Compiler -> 1.5.1 ({n_cc})")

        content = re.sub(r'ndk\s*\{[^{}]*abiFilters[^{}]*\}', '', content, flags=re.DOTALL)
        content = re.sub(r'splits\s*\{[^}]*abi\s*\{[^}]*\}', '', content, flags=re.DOTALL)

        injection = ('\n        ndk { abiFilters.add("armeabi-v7a") }'
                     if is_kts else
                     '\n        ndk { abiFilters "armeabi-v7a" }')
        content, n = re.subn(r'(defaultConfig\s*\{)',
                             lambda m: m.group(1) + injection,
                             content, count=1)
        if n == 0:
            print(f"❌ defaultConfig not found in {target}")
            sys.exit(1)

        def add_dep(content, marker, dep_line, is_kts):
            if marker in content:
                print(f"⏭️  {marker} already present")
                return content
            patterns = [
                r'implementation\(platform\("androidx\.compose:compose-bom:[^"]*"\)\)',
                r'implementation\("androidx\.compose\.material3:material3"\)',
                r'implementation\("androidx\.compose\.material:material-icons-extended"\)',
                r'implementation\("androidx\.lifecycle:lifecycle-runtime-compose:[^"]*"\)',
                r'implementation\s+"androidx\.compose\.material3:material3"',
                r'dependencies\s*\{'
            ]
            for pat in patterns:
                m = re.search(pat, content)
                if m:
                    content = content[:m.end()] + '\n    ' + dep_line + content[m.end():]
                    print(f"✅ Added {marker}")
                    return content
            print(f"⚠️  Could not add {marker}")
            return content

        content = add_dep(content,
                          'material-icons-extended',
                          'implementation("androidx.compose.material:material-icons-extended")',
                          is_kts)
        content = add_dep(content,
                          'compose-runtime',
                          'implementation("androidx.compose.runtime:runtime")',
                          is_kts)

        content = re.sub(
            r'freeCompilerArgs\s*\+=\s*listOf\([^)]*\)',
            '', content, flags=re.DOTALL
        )
        optin_flags = (
            'freeCompilerArgs += listOf(\n'
            '            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",\n'
            '            "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi"\n'
            '        )'
        )
        if 'kotlinOptions {' in content:
            content = re.sub(r'kotlinOptions\s*\{',
                             'kotlinOptions {\n        ' + optin_flags,
                             content, count=1)
            print("✅ Injected opt-in flags")
        else:
            m = re.search(r'(composeOptions\s*\{[^}]*\})', content, re.DOTALL)
            if m:
                content = content[:m.end()] + \
                          '\n\n    kotlinOptions {\n        jvmTarget = "1.8"\n        ' + \
                          optin_flags + '\n    }' + content[m.end():]
                print("✅ Created kotlinOptions block")

        with open(target, 'w') as f:
            f.write(content)
        print(f"\n✅ Patched {target}")
        PYEOF

    - name: Fix Room @TypeConverters error
      run: |
        python3 << 'PYEOF'
        import re, glob, sys
        candidates = glob.glob('**/AppDatabase.kt', recursive=True)
        if not candidates:
            print("⚠️  AppDatabase.kt not found — skipping"); sys.exit(0)
        target = candidates[0]
        with open(target) as f:
            content = f.read()
        new_content, n = re.subn(
            r'^(\s*)@TypeConverters\s*\([^)]*\)',
            r'\1// @TypeConverters(...) removed by CI: no @TypeConverter methods',
            content, flags=re.MULTILINE)
        if n == 0:
            print("⏭️  No @TypeConverters annotation"); sys.exit(0)
        with open(target, 'w') as f:
            f.write(new_content)
        print(f"✅ Commented out {n} @TypeConverters annotation(s)")
        PYEOF

    - name: Fix HexViewScreen.kt source bugs
      run: |
        python3 << 'PYEOF'
        import re, glob, sys
        candidates = glob.glob('**/HexViewScreen.kt', recursive=True)
        if not candidates:
            print("⚠️  HexViewScreen.kt not found"); sys.exit(0)
        target = candidates[0]
        with open(target) as f:
            content = f.read()

        before = content
        content = content.replace(
            'Column(horizontalAlignment = Alignment.CenterVertically)',
            'Column(horizontalAlignment = Alignment.CenterHorizontally)')
        print("✅ Fix 1 (Alignment)" if content != before else "⏭️  Fix 1 already done")

        before = content
        content = re.sub(
            r'val rows = hexData\.chunked\(bytesPerRow\)',
            'val rows = hexData.toList().chunked(bytesPerRow)',
            content)
        print("✅ Fix 2 (chunked)" if content != before else "⏭️  Fix 2 already done")

        with open(target, 'w') as f:
            f.write(content)
        PYEOF

    - name: Fix collectAsState import (compose-runtime)
      run: |
        python3 << 'PYEOF'
        import re, glob, sys
        targets = []
        for pattern in ['**/ui/**/*.kt', '**/*Screen.kt']:
            targets.extend(glob.glob(pattern, recursive=True))
        targets = sorted(set(targets))
        patched = 0
        for path in targets:
            with open(path) as f:
                content = f.read()
            new_content = re.sub(
                r'import androidx\.lifecycle\.compose\.collectAsState\b',
                'import androidx.compose.runtime.collectAsState',
                content
            )
            if new_content != content:
                with open(path, 'w') as f:
                    f.write(new_content)
                print(f"✅ Fixed import in {path}")
                patched += 1
        if patched == 0:
            print("⏭️  No files needed the import fix")
        PYEOF

    - name: Inject missing Android resources
      run: |
        set -e
        RES=app/src/main/res
        mkdir -p $RES/values $RES/xml $RES/drawable
        mkdir -p $RES/mipmap-anydpi-v26
        mkdir -p $RES/mipmap-mdpi $RES/mipmap-hdpi $RES/mipmap-xhdpi $RES/mipmap-xxhdpi $RES/mipmap-xxxhdpi

        cat > $RES/values/strings.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources><string name="app_name">IDA Pro Mobile</string></resources>
        EOF

        cat > $RES/values/themes.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.IdaProMobile" parent="android:Theme.Material.NoActionBar">
                <item name="android:statusBarColor">#FF1E1E1E</item>
                <item name="android:navigationBarColor">#FF1E1E1E</item>
                <item name="android:windowBackground">#FF1E1E1E</item>
            </style>
        </resources>
        EOF

        cat > $RES/values/colors.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources><color name="ic_launcher_background">#FF1E1E1E</color></resources>
        EOF

        cat > $RES/xml/backup_rules.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <full-backup-content></full-backup-content>
        EOF

        cat > $RES/xml/data_extraction_rules.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <data-extraction-rules>
            <cloud-backup></cloud-backup>
            <device-transfer></device-transfer>
        </data-extraction-rules>
        EOF

        cat > $RES/drawable/ic_launcher_foreground.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#FF4CAF50" android:pathData="M30,30h48v48h-48z"/>
            <path android:fillColor="#FFFFFFFF"
                android:pathData="M40,40h6v28h-6z M50,40h18v6h-12v22h-6z"/>
        </vector>
        EOF

        cat > $RES/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
        </adaptive-icon>
        EOF
        cp $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml

        for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
          cat > $RES/$d/ic_launcher.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="48dp" android:height="48dp"
            android:viewportWidth="48" android:viewportHeight="48">
            <path android:fillColor="#FF1E1E1E" android:pathData="M0,0h48v48h-48z"/>
            <path android:fillColor="#FF4CAF50" android:pathData="M12,12h24v24h-24z"/>
            <path android:fillColor="#FFFFFFFF"
                android:pathData="M18,18h3v12h-3z M24,18h8v3h-5v9h-3z"/>
        </vector>
        EOF
          cp $RES/$d/ic_launcher.xml $RES/$d/ic_launcher_round.xml
        done
        echo "=== Resources created ==="

    - name: Inject stub openssl/sha.h + SHA256 implementation
      run: |
        set -e
        mkdir -p app/src/main/cpp/openssl

        cat > app/src/main/cpp/openssl/sha.h << 'HEADER_EOF'
        #ifndef OPENSSL_SHA_H
        #define OPENSSL_SHA_H
        #include <stdint.h>
        #include <stddef.h>
        #define SHA256_DIGEST_LENGTH 32
        #ifdef __cplusplus
        extern "C" {
        #endif
        typedef struct { uint32_t state[8]; uint64_t count; uint8_t buf[64]; } SHA256_CTX;
        int SHA256_Init(SHA256_CTX *c);
        int SHA256_Update(SHA256_CTX *c, const void *data, size_t len);
        int SHA256_Final(unsigned char *md, SHA256_CTX *c);
        unsigned char *SHA256(const unsigned char *d, size_t n, unsigned char *md);
        #ifdef __cplusplus
        }
        #endif
        #endif
        HEADER_EOF

        cat > app/src/main/cpp/sha256_stub.c << 'IMPL_EOF'
        #include "openssl/sha.h"
        #include <string.h>
        static const uint32_t K[64] = {
            0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
            0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
            0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
            0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
            0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
            0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
            0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
            0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
        };
        #define ROTR(x,n) (((x) >> (n)) | ((x) << (32 - (n))))
        static void sha256_transform(uint32_t s[8], const uint8_t b[64]) {
            uint32_t w[64], a=s[0],bb=s[1],c=s[2],d=s[3],e=s[4],f=s[5],g=s[6],h=s[7],t1,t2; int i;
            for (i=0;i<16;i++) w[i]=((uint32_t)b[i*4]<<24)|((uint32_t)b[i*4+1]<<16)|((uint32_t)b[i*4+2]<<8)|b[i*4+3];
            for (i=16;i<64;i++){uint32_t s0=ROTR(w[i-15],7)^ROTR(w[i-15],18)^(w[i-15]>>3);uint32_t s1=ROTR(w[i-2],17)^ROTR(w[i-2],19)^(w[i-2]>>10);w[i]=w[i-16]+s0+w[i-7]+s1;}
            for (i=0;i<64;i++){uint32_t S1=ROTR(e,6)^ROTR(e,11)^ROTR(e,25);uint32_t ch=(e&f)^((~e)&g);t1=h+S1+ch+K[i]+w[i];uint32_t S0=ROTR(a,2)^ROTR(a,13)^ROTR(a,22);uint32_t maj=(a&bb)^(a&c)^(bb&c);t2=S0+maj;h=g;g=f;f=e;e=d+t1;d=c;c=bb;bb=a;a=t1+t2;}
            s[0]+=a;s[1]+=bb;s[2]+=c;s[3]+=d;s[4]+=e;s[5]+=f;s[6]+=g;s[7]+=h;
        }
        int SHA256_Init(SHA256_CTX *c){c->state[0]=0x6a09e667;c->state[1]=0xbb67ae85;c->state[2]=0x3c6ef372;c->state[3]=0xa54ff53a;c->state[4]=0x510e527f;c->state[5]=0x9b05688c;c->state[6]=0x1f83d9ab;c->state[7]=0x5be0cd19;c->count=0;return 1;}
        int SHA256_Update(SHA256_CTX *c,const void *data,size_t len){const uint8_t*p=(const uint8_t*)data;size_t idx=(size_t)(c->count&63);c->count+=len;while(len>0){size_t n=64-idx;if(n>len)n=len;memcpy(c->buf+idx,p,n);idx+=n;p+=n;len-=n;if(idx==64){sha256_transform(c->state,c->buf);idx=0;}}return 1;}
        int SHA256_Final(unsigned char *md,SHA256_CTX *c){uint64_t bits=c->count*8;size_t idx=(size_t)(c->count&63);uint8_t pad[72];pad[0]=0x80;size_t padlen=(idx<56)?(56-idx):(120-idx);memset(pad+1,0,padlen-1);SHA256_Update(c,pad,padlen);uint8_t lenbuf[8];for(int i=0;i<8;i++)lenbuf[i]=(uint8_t)(bits>>(56-8*i));SHA256_Update(c,lenbuf,8);for(int i=0;i<8;i++){md[i*4]=(uint8_t)(c->state[i]>>24);md[i*4+1]=(uint8_t)(c->state[i]>>16);md[i*4+2]=(uint8_t)(c->state[i]>>8);md[i*4+3]=(uint8_t)c->state[i];}return 1;}
        unsigned char *SHA256(const unsigned char*d,size_t n,unsigned char*md){SHA256_CTX c;static unsigned char m[SHA256_DIGEST_LENGTH];if(md==NULL)md=m;SHA256_Init(&c);SHA256_Update(&c,d,n);SHA256_Final(md,&c);return md;}
        IMPL_EOF

        CMAKE_FILE="app/src/main/cpp/CMakeLists.txt"
        if [ ! -f "$CMAKE_FILE" ]; then
          CMAKE_FILE=$(find app/src/main -name CMakeLists.txt | head -n1)
        fi
        cat >> "$CMAKE_FILE" << 'CMAKE_EOF'

        # === Injected by CI: OpenSSL/SHA stub ===
        add_library(sha256_stub STATIC sha256_stub.c)
        target_include_directories(sha256_stub PUBLIC ${CMAKE_CURRENT_SOURCE_DIR})
        target_link_libraries(binary_analyzer sha256_stub)
        CMAKE_EOF

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install NDK 25.1.8937393
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.1.8937393"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

    - name: Build Debug APK (armeabi-v7a only)
      run: |
        ./gradlew clean assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-build.log || true
        echo ""
        echo "=== Kotlin compile errors (if any) ==="
        grep -E "^e: file:" /tmp/gradle-build.log | head -n 50 || true
        echo ""
        if grep -q "BUILD FAILED" /tmp/gradle-build.log; then
          exit 1
        fi

    - name: Verify APK contains ONLY armeabi-v7a
      if: success()
      run: |
        APK=$(find . -name "app-debug.apk" -path "*/outputs/apk/*" | head -n 1)
        if [ -n "$APK" ] && [ -f "$APK" ]; then
          echo "APK: $APK"
          unzip -l "$APK" | grep "lib/" || echo "(no lib/ entries)"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/" \
            && echo "✅ armeabi-v7a present" \
            || { echo "❌ armeabi-v7a MISSING"; exit 1; }
        else
          echo "❌ APK not found!"
          exit 1
        fi

    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ida-pro-mobile-armeabi-v7a-debug
        path: |
          **/build/outputs/apk/debug/*.apk
        if-no-files-found: error

    - name: Upload build log (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: /tmp/gradle-build.log
        if-no-files-found: ignore
