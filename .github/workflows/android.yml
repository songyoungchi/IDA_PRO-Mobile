name: Build IDA Pro Mobile (armeabi-v7a ONLY / API 27)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Patch app module build file - force armeabi-v7a + Compose + icons
      run: |
        python3 << 'PYEOF'
        import re, glob, sys

        candidates = []
        for path in glob.glob('**/build.gradle', recursive=True) + \
                    glob.glob('**/build.gradle.kts', recursive=True):
            if '/build/' in path or '/.gradle/' in path or '/.cxx/' in path:
                continue
            try:
                with open(path) as f:
                    c = f.read()
            except Exception:
                continue
            if re.search(r'defaultConfig\s*\{', c):
                candidates.append(path)

        if not candidates:
            print("❌ No build file with defaultConfig block found!")
            sys.exit(1)

        preferred = ['app/build.gradle.kts', 'app/build.gradle']
        target = next((p for p in preferred if p in candidates), candidates[0])
        print(f"✅ Target: {target}")

        with open(target) as f:
            content = f.read()

        is_kts = target.endswith('.kts')

        # 1) Fix activity-result -> activity
        content = content.replace(
            'androidx.activity:activity-result',
            'androidx.activity:activity'
        )

        # 2) Force Compose Compiler = 1.5.1 (Kotlin 1.9.0 compatible)
        content, n_cc = re.subn(
            r'kotlinCompilerExtensionVersion\s*=\s*"[^"]*"',
            'kotlinCompilerExtensionVersion = "1.5.1"',
            content
        )
        print(f"✅ Compose Compiler -> 1.5.1 ({n_cc} replacement)")

        # 3) Remove existing ndk abiFilters / splits.abi blocks
        content = re.sub(r'ndk\s*\{[^{}]*abiFilters[^{}]*\}', '', content, flags=re.DOTALL)
        content = re.sub(r'splits\s*\{[^}]*abi\s*\{[^}]*\}', '', content, flags=re.DOTALL)

        # 4) Inject armeabi-v7a filter right after defaultConfig {
        injection = ('\n        ndk { abiFilters.add("armeabi-v7a") }'
                     if is_kts else
                     '\n        ndk { abiFilters "armeabi-v7a" }')
        content, n = re.subn(r'(defaultConfig\s*\{)',
                             lambda m: m.group(1) + injection,
                             content, count=1)
        if n == 0:
            print(f"❌ defaultConfig not found in {target}")
            sys.exit(1)

        # 5) Add material-icons-extended dependency (once)
        if 'material-icons-extended' not in content:
            # Try KTS style first, then Groovy
            for pattern in [
                r'(implementation\(platform\("androidx\.compose:compose-bom:[^"]*"\)\))',
                r'(implementation\("androidx\.compose\.material3:material3"\))',
                r'(implementation\s+"androidx\.compose\.material3:material3")',
                r'(dependencies\s*\{)'
            ]:
                m = re.search(pattern, content)
                if m:
                    if is_kts:
                        dep = '\n    implementation("androidx.compose.material:material-icons-extended")'
                    else:
                        dep = '\n    implementation "androidx.compose.material:material-icons-extended"'
                    content = content[:m.end()] + dep + content[m.end():]
                    print(f"✅ Added material-icons-extended after: {m.group(1)[:60]}...")
                    break
            else:
                print("⚠️  Could not add material-icons-extended (no dependencies block found)")

        # 6) Add Compose experimental API opt-ins to kotlinOptions
        if 'ExperimentalMaterial3Api' not in content:
            optin_flags = (
                'freeCompilerArgs += listOf(\n'
                '            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",\n'
                '            "-opt-in=androidx.compose.material.ExperimentalMaterialApi",\n'
                '            "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi"\n'
                '        )'
            )
            # Find kotlinOptions block and inject
            m = re.search(r'kotlinOptions\s*\{', content)
            if m:
                content = content[:m.end()] + '\n        ' + optin_flags + content[m.end():]
                print("✅ Added Compose experimental API opt-ins")
            else:
                # No kotlinOptions block — add one after buildFeatures or composeOptions
                m = re.search(r'(composeOptions\s*\{[^}]*\})', content, re.DOTALL)
                if m:
                    kts_block = '\n\n    kotlinOptions {\n        jvmTarget = "1.8"\n        ' + optin_flags + '\n    }'
                    content = content[:m.end()] + kts_block + content[m.end():]
                    print("✅ Added kotlinOptions block with opt-ins")
                else:
                    print("⚠️  Could not add compiler opt-ins")

        with open(target, 'w') as f:
            f.write(content)
        print(f"\n✅ Patched {target}")
        print("=== Final relevant lines ===")
        for i, line in enumerate(content.splitlines(), 1):
            if ('abiFilters' in line or 'kotlinCompilerExtensionVersion' in line
                    or 'material-icons-extended' in line or 'opt-in' in line
                    or 'activity:' in line or 'kotlinOptions' in line):
                print(f"{i:3d}: {line}")
        PYEOF

    - name: Fix Room @TypeConverters error
      run: |
        python3 << 'PYEOF'
        import re, glob, sys

        candidates = glob.glob('**/AppDatabase.kt', recursive=True)
        if not candidates:
            print("⚠️  AppDatabase.kt not found — skipping")
            sys.exit(0)

        target = candidates[0]
        print(f"=== Patching {target} ===")

        with open(target) as f:
            content = f.read()

        new_content, n = re.subn(
            r'^(\s*)@TypeConverters\s*\([^)]*\)',
            r'\1// @TypeConverters(...) removed by CI: referenced class has no @TypeConverter methods',
            content,
            flags=re.MULTILINE
        )
        if n == 0:
            print("⚠️  No @TypeConverters annotation found — nothing to do")
            sys.exit(0)
        print(f"✅ Commented out {n} @TypeConverters annotation(s)")

        with open(target, 'w') as f:
            f.write(new_content)
        PYEOF

    - name: Debug - show HexViewScreen.kt
      run: |
        F=$(find . -name "HexViewScreen.kt" -not -path "*/build/*" | head -n1)
        if [ -n "$F" ]; then
          echo "=== $F (full) ==="
          cat -n "$F"
        else
          echo "HexViewScreen.kt not found"
        fi

    - name: Inject missing Android resources
      run: |
        set -e
        RES=app/src/main/res
        mkdir -p $RES/values $RES/xml $RES/drawable
        mkdir -p $RES/mipmap-anydpi-v26
        mkdir -p $RES/mipmap-mdpi $RES/mipmap-hdpi $RES/mipmap-xhdpi $RES/mipmap-xxhdpi $RES/mipmap-xxxhdpi

        cat > $RES/values/strings.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">IDA Pro Mobile</string>
        </resources>
        EOF

        cat > $RES/values/themes.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.IdaProMobile" parent="android:Theme.Material.NoActionBar">
                <item name="android:statusBarColor">#FF1E1E1E</item>
                <item name="android:navigationBarColor">#FF1E1E1E</item>
                <item name="android:windowBackground">#FF1E1E1E</item>
            </style>
        </resources>
        EOF

        cat > $RES/values/colors.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="ic_launcher_background">#FF1E1E1E</color>
        </resources>
        EOF

        cat > $RES/xml/backup_rules.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <full-backup-content>
        </full-backup-content>
        EOF

        cat > $RES/xml/data_extraction_rules.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <data-extraction-rules>
            <cloud-backup></cloud-backup>
            <device-transfer></device-transfer>
        </data-extraction-rules>
        EOF

        cat > $RES/drawable/ic_launcher_foreground.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path android:fillColor="#FF4CAF50" android:pathData="M30,30h48v48h-48z"/>
            <path android:fillColor="#FFFFFFFF"
                android:pathData="M40,40h6v28h-6z M50,40h18v6h-12v22h-6z"/>
        </vector>
        EOF

        cat > $RES/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
        </adaptive-icon>
        EOF
        cp $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml

        for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
          cat > $RES/$d/ic_launcher.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="48dp"
            android:height="48dp"
            android:viewportWidth="48"
            android:viewportHeight="48">
            <path android:fillColor="#FF1E1E1E" android:pathData="M0,0h48v48h-48z"/>
            <path android:fillColor="#FF4CAF50" android:pathData="M12,12h24v24h-24z"/>
            <path android:fillColor="#FFFFFFFF"
                android:pathData="M18,18h3v12h-3z M24,18h8v3h-5v9h-3z"/>
        </vector>
        EOF
          cp $RES/$d/ic_launcher.xml $RES/$d/ic_launcher_round.xml
        done

        echo "=== Created resources ==="
        find $RES -type f | sort

    - name: Inject stub openssl/sha.h + SHA256 implementation
      run: |
        set -e
        mkdir -p app/src/main/cpp/openssl

        cat > app/src/main/cpp/openssl/sha.h << 'HEADER_EOF'
        #ifndef OPENSSL_SHA_H
        #define OPENSSL_SHA_H
        #include <stdint.h>
        #include <stddef.h>

        #define SHA256_DIGEST_LENGTH 32

        #ifdef __cplusplus
        extern "C" {
        #endif

        typedef struct {
            uint32_t state[8];
            uint64_t count;
            uint8_t  buf[64];
        } SHA256_CTX;

        int SHA256_Init(SHA256_CTX *c);
        int SHA256_Update(SHA256_CTX *c, const void *data, size_t len);
        int SHA256_Final(unsigned char *md, SHA256_CTX *c);
        unsigned char *SHA256(const unsigned char *d, size_t n, unsigned char *md);

        #ifdef __cplusplus
        }
        #endif
        #endif
        HEADER_EOF

        cat > app/src/main/cpp/sha256_stub.c << 'IMPL_EOF'
        #include "openssl/sha.h"
        #include <string.h>

        static const uint32_t K[64] = {
            0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
            0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
            0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
            0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
            0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
            0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
            0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
            0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
        };

        #define ROTR(x,n) (((x) >> (n)) | ((x) << (32 - (n))))

        static void sha256_transform(uint32_t state[8], const uint8_t block[64]) {
            uint32_t w[64], a,b,c,d,e,f,g,h,t1,t2;
            int i;
            for (i = 0; i < 16; i++) {
                w[i] = ((uint32_t)block[i*4]   << 24) |
                       ((uint32_t)block[i*4+1] << 16) |
                       ((uint32_t)block[i*4+2] <<  8) |
                       ((uint32_t)block[i*4+3]);
            }
            for (i = 16; i < 64; i++) {
                uint32_t s0 = ROTR(w[i-15],7) ^ ROTR(w[i-15],18) ^ (w[i-15] >> 3);
                uint32_t s1 = ROTR(w[i-2],17) ^ ROTR(w[i-2],19) ^ (w[i-2] >> 10);
                w[i] = w[i-16] + s0 + w[i-7] + s1;
            }
            a=state[0]; b=state[1]; c=state[2]; d=state[3];
            e=state[4]; f=state[5]; g=state[6]; h=state[7];
            for (i = 0; i < 64; i++) {
                uint32_t S1 = ROTR(e,6) ^ ROTR(e,11) ^ ROTR(e,25);
                uint32_t ch = (e & f) ^ ((~e) & g);
                t1 = h + S1 + ch + K[i] + w[i];
                uint32_t S0 = ROTR(a,2) ^ ROTR(a,13) ^ ROTR(a,22);
                uint32_t maj = (a & b) ^ (a & c) ^ (b & c);
                t2 = S0 + maj;
                h=g; g=f; f=e; e=d+t1;
                d=c; c=b; b=a; a=t1+t2;
            }
            state[0]+=a; state[1]+=b; state[2]+=c; state[3]+=d;
            state[4]+=e; state[5]+=f; state[6]+=g; state[7]+=h;
        }

        int SHA256_Init(SHA256_CTX *c) {
            c->state[0]=0x6a09e667; c->state[1]=0xbb67ae85;
            c->state[2]=0x3c6ef372; c->state[3]=0xa54ff53a;
            c->state[4]=0x510e527f; c->state[5]=0x9b05688c;
            c->state[6]=0x1f83d9ab; c->state[7]=0x5be0cd19;
            c->count=0;
            return 1;
        }

        int SHA256_Update(SHA256_CTX *c, const void *data, size_t len) {
            const uint8_t *p = (const uint8_t*)data;
            size_t idx = (size_t)(c->count & 63);
            c->count += len;
            while (len > 0) {
                size_t n = 64 - idx;
                if (n > len) n = len;
                memcpy(c->buf + idx, p, n);
                idx += n; p += n; len -= n;
                if (idx == 64) { sha256_transform(c->state, c->buf); idx = 0; }
            }
            return 1;
        }

        int SHA256_Final(unsigned char *md, SHA256_CTX *c) {
            uint64_t bits = c->count * 8;
            size_t idx = (size_t)(c->count & 63);
            uint8_t pad[72];
            size_t padlen;
            pad[0] = 0x80;
            padlen = (idx < 56) ? (56 - idx) : (120 - idx);
            memset(pad + 1, 0, padlen - 1);
            SHA256_Update(c, pad, padlen);
            uint8_t lenbuf[8];
            for (int i = 0; i < 8; i++) lenbuf[i] = (uint8_t)(bits >> (56 - 8*i));
            SHA256_Update(c, lenbuf, 8);
            for (int i = 0; i < 8; i++) {
                md[i*4]   = (uint8_t)(c->state[i] >> 24);
                md[i*4+1] = (uint8_t)(c->state[i] >> 16);
                md[i*4+2] = (uint8_t)(c->state[i] >>  8);
                md[i*4+3] = (uint8_t)(c->state[i]);
            }
            return 1;
        }

        unsigned char *SHA256(const unsigned char *d, size_t n, unsigned char *md) {
            SHA256_CTX c;
            static unsigned char m[SHA256_DIGEST_LENGTH];
            if (md == NULL) md = m;
            SHA256_Init(&c);
            SHA256_Update(&c, d, n);
            SHA256_Final(md, &c);
            return md;
        }
        IMPL_EOF

        CMAKE_FILE="app/src/main/cpp/CMakeLists.txt"
        if [ ! -f "$CMAKE_FILE" ]; then
          CMAKE_FILE=$(find app/src/main -name CMakeLists.txt | head -n1)
        fi
        echo "Patching CMake: $CMAKE_FILE"
        cat >> "$CMAKE_FILE" << 'CMAKE_EOF'

        # === Injected by CI: OpenSSL/SHA stub ===
        add_library(sha256_stub STATIC sha256_stub.c)
        target_include_directories(sha256_stub PUBLIC ${CMAKE_CURRENT_SOURCE_DIR})
        # Match plain signature used at line 30 of original CMakeLists.txt
        target_link_libraries(binary_analyzer sha256_stub)
        CMAKE_EOF

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install NDK 25.1.8937393
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.1.8937393"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

    - name: Build Debug APK (armeabi-v7a only)
      run: |
        echo "=== abiFilters check ==="
        grep -n "abiFilters" app/build.gradle.kts || echo "(none)"
        echo "=== Compose Compiler version ==="
        grep -n "kotlinCompilerExtensionVersion" app/build.gradle.kts || echo "(none)"
        echo "=== material-icons-extended check ==="
        grep -n "material-icons-extended" app/build.gradle.kts || echo "(none)"
        echo "=== opt-in flags check ==="
        grep -n "opt-in" app/build.gradle.kts || echo "(none)"
        ./gradlew clean assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-build.log || true
        echo ""
        echo "=== Final failure summary (last 100 lines) ==="
        tail -n 100 /tmp/gradle-build.log
        # Fail the step if Gradle actually failed
        if grep -q "BUILD FAILED" /tmp/gradle-build.log; then
          exit 1
        fi

    - name: Verify APK contains ONLY armeabi-v7a
      if: success()
      run: |
        APK=$(find . -name "app-debug.apk" -path "*/outputs/apk/*" | head -n 1)
        if [ -n "$APK" ] && [ -f "$APK" ]; then
          echo "APK: $APK"
          unzip -l "$APK" | grep "lib/" || echo "(no lib/ entries)"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/" \
            && echo "✅ armeabi-v7a present" \
            || { echo "❌ armeabi-v7a MISSING"; exit 1; }
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/"; then
            echo "⚠️ arm64-v8a still present — patch failed!"
          fi
        else
          echo "❌ APK not found!"
          exit 1
        fi

    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ida-pro-mobile-armeabi-v7a-debug
        path: |
          **/build/outputs/apk/debug/*.apk
        if-no-files-found: error

    - name: Upload build log (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: /tmp/gradle-build.log
        if-no-files-found: ignore
